note: >-
  Amazon Nova's MCP and REST surfaces barely overlap, and the crosswalk exists to say so plainly.
  The AWS MCP Server does not expose a single tool that maps onto a Bedrock Runtime operation —
  every one of its nine tools is control-plane, documentation, or generic-execution. An agent
  reaches Nova through it only INDIRECTLY, by asking run_script/call_aws to shell out to the
  bedrock-runtime CLI or boto3 client. The only tools that bind to a real Nova operation come from
  the deprecated Nova Canvas stdio server.
