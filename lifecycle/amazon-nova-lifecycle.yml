versioning:
  scheme: model-id-version
  current: '2023-09-30'
  api_version_note: >-
    The Amazon Bedrock Runtime API itself is pinned at the 2023-09-30 service version and has not
    been rev'd. Versioning that matters to a Nova caller happens in the MODEL ID
    (amazon.nova-pro-v1:0, amazon.nova-reel-v1:1), and in the model family generation — Amazon
    Nova 2 ships as a separate documentation set and separate model ids.
  docs: https://docs.aws.amazon.com/bedrock/latest/userguide/model-lifecycle.html
deprecation:
  policy_url: https://docs.aws.amazon.com/bedrock/latest/userguide/model-lifecycle.html
  sunset_header: false
  states: [Active, Legacy, EOL]
  guarantees:
  - A model stays in the Legacy state for at least 6 months before its EOL date.
  - Customers are notified when a model provider moves a model to Legacy.
  - New customers cannot start using a Legacy model; existing customers may lose access after 15 days of inactivity.
  - >-
    For models with EOL dates after 2026-02-01, after a minimum of 3 months in Legacy the model
    enters a public extended access period of at least 3 more months, at provider-set (higher) pricing.
  - After the EOL date requests to that model version fail; migration is never automatic.
  runtime_signal: >-
    The state is machine-readable — GetFoundationModel and ListFoundationModels return it in the
    `modelLifecycle` field. There is no RFC 8594 Sunset/Deprecation response header on the
    inference call itself, so an agent cannot learn a model is Legacy from an invoke response.
