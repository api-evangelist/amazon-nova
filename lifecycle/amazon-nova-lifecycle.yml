finding: >-
  Five of the seven Amazon Nova v1 model ids are in the Legacy state with EOL dates inside
  September 2026 — Premier and Sonic on 2026-09-14, Canvas and both Reel versions on 2026-09-30.
  As of this pass (2026-09-01) an integration written against Nova Premier, Sonic, Canvas or Reel
  v1 has between 13 and 29 days of guaranteed life left. Nova Pro, Lite and Micro remain Active,
  and the Amazon Nova 2 family (Nova 2 Lite, Nova 2 Pro, Nova 2 Omni, Nova Sonic 2.0) is the
  forward path.
