aid: amazon-nova
name: Amazon Nova
description: >-
  Amazon Nova is a new generation of frontier intelligence models from Amazon
  that deliver a compelling combination of accuracy, speed, and cost. Amazon
  Nova models are accessible through Amazon Bedrock and are designed for a
  wide range of tasks including text, image, and video understanding.
