note: >-
  Amazon Nova has no Nova-branded client library. It is invoked through the Amazon Bedrock
  Runtime API, so the first-party client surface is the AWS SDK's bedrock-runtime client in
  each language — published by Amazon Web Services under the aws / awslabs / software.amazon.awssdk
  namespaces. Two Nova-specific first-party packages exist: the Amazon Nova Act Python SDK and
  the (now deprecated) AWS Labs Nova Canvas MCP server.
