specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: Amazon Nova
providerId: amazon-nova
created: '2026-05-04'
modified: '2026-09-01'
generated: '2026-09-01'
method: searched
source: https://docs.aws.amazon.com/general/latest/gr/bedrock.html
docs:
- https://docs.aws.amazon.com/nova/latest/userguide/quotas.html
- https://docs.aws.amazon.com/general/latest/gr/bedrock.html
- https://console.aws.amazon.com/servicequotas/home/services/bedrock/quotas
description: >-
  Published Amazon Bedrock service quotas that govern Amazon Nova model invocation, harvested from
  the AWS General Reference quota tables on 2026-09-01. This file REPLACES an API Evangelist
  scaffold dated 2026-05-04 that asserted invented per-key request quotas and X-RateLimit-*
  headers; none of those existed. Amazon Nova is not rate limited per API key at all — it is
  quota'd per AWS account, per region, per MODEL, in requests-per-minute and tokens-per-minute.
tags:
- AWS
- Foundation Models
- Rate Limiting
- Quotas
- Throttling
headers:
  limit: null
  remaining: null
  reset: null
  retryAfter: null
  policy: null
header_note: >-
  Amazon Bedrock Runtime returns NO rate-limit response headers of any kind. There is no
  RateLimit-*, no X-RateLimit-*, and no Retry-After. On exhaustion the caller gets HTTP 429 with
  x-amzn-ErrorType ThrottlingException and a `message` body, and must discover remaining headroom
  out-of-band via Service Quotas or CloudWatch metrics.
responseCodes:
  throttled: 429
  quotaExceeded: 400
  serviceUnavailable: 503
error_types:
  throttled: ThrottlingException
  model_not_ready: ModelNotReadyException
  quota: ServiceQuotaExceededException
scope: per AWS account, per region, per model
adjustable: >-
  Most token-per-minute quotas are adjustable through the Service Quotas console; most
  requests-per-minute quotas for on-demand inference are marked not adjustable.
limits:
- name: On-demand model inference requests per minute for Amazon Nova Micro
  model_id: amazon.nova-micro-v1:0
  scope: account-region-model
  metric: requests_per_minute
  limit: 2000
  regional_variance: 'us-east-1: 2,000; eu-west-2: 2,000; each other supported region: 200'
  adjustable: false
  applies: [converse, converseStream, invokeModel, invokeModelWithResponseStream]
- name: On-demand model inference tokens per minute for Amazon Nova Micro
