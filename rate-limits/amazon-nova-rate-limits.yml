policies:
- name: Backoff Strategy
  description: >-
    No Retry-After is returned, so a caller must implement exponential backoff with jitter on its
    own. ModelNotReadyException is the only error Amazon marks retryable in the service model;
    AWS SDKs retry it automatically.
- name: Quota Discovery
  description: >-
    Current and remaining quota is not observable from a response. Read it from the Service Quotas
    console or API (service code `bedrock`) and from CloudWatch metrics.
- name: Quota Increase
  description: >-
    Token-per-minute quotas are generally adjustable via Service Quotas; on-demand
    requests-per-minute quotas for most Nova models are marked not adjustable.
limit_count: 20
