description: >-
  Amazon Nova has no plan tiers. It is pure consumption pricing, metered per 1,000 tokens (or per
  image / per video), published machine-readably in the AWS Price List Bulk API. Every price below
  was read from that endpoint on 2026-09-01 for us-east-1 on-demand usage. This file REPLACES an
  API Evangelist scaffold dated 2026-05-04 that invented a Free / Professional / Enterprise ladder
  with placeholder quotas; Amazon publishes no such thing for Nova.
tags:
- AWS
- Foundation Models
- Generative AI
- Usage Based Pricing
plan_count: 0
pricing_model: pay-as-you-go
purchase_modes:
- name: On-Demand
  description: Per-token / per-image / per-video, no commitment. The prices listed below.
- name: Flex
  description: Lower-priority throughput at roughly half the on-demand token price.
- name: Priority
  description: Higher-priority throughput at roughly 1.75x the on-demand token price.
- name: Batch
  description: Offline batch inference, discounted against on-demand.
- name: Provisioned Throughput
  description: >-
    Reserved model units billed hourly. us-east-1 model units for Nova Micro / Lite / Pro /
    Canvas price at 60.50 USD/hour with no commitment, 55.00 USD/hour on a 1-month commitment and
    30.25 USD/hour on a 6-month commitment.
free_tier:
  available: false
  note: >-
    Amazon Bedrock has no perpetual free tier for Nova inference. New AWS accounts may receive
    general AWS Free Tier credits, but no Nova-specific free allowance is published.
